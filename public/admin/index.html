<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://*.web.app https://*.firebaseapp.com https://cabros-bot-production.up.railway.app; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="Referrer-Policy" content="no-referrer">
  <title>Cabros Bot Console</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to workspace</a>
  <main id="console-shell" class="console-shell">
    <aside class="console-sidebar">
      <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true">CB</span>
        <div>
          <p class="eyebrow">Operations</p>
          <h1>Cabros Bot</h1>
        </div>
      </div>
      <nav id="console-nav" class="console-nav" aria-label="Console sections">
        <p class="nav-label">Workspace</p>
        <button data-view="overview" type="button" aria-current="page"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg><span class="nav-text">Overview</span></button>
        <button data-view="status" type="button"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l2.5-6 5 12L17 12h4"/></svg><span class="nav-text">Status</span></button>
        <button data-view="diagnostics" type="button"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16"/><path d="M7 6v3a5 5 0 0 0 10 0V6"/><path d="M12 14v4"/><path d="M8.5 21h7"/></svg><span class="nav-text">Diagnostics</span></button>
        <button data-view="alerts" type="button"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3"/></svg><span class="nav-text">Alerts</span></button>
        <button data-view="outcomes" type="button"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg><span class="nav-text">Outcomes</span></button>
        <button data-view="presets" type="button"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 9-7 9-7-9z"/></svg><span class="nav-text">Presets</span></button>
        <button data-view="jobs" type="button"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></svg><span class="nav-text">Jobs</span></button>
        <button data-view="orders" type="button"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18"/><path d="M3 12h18"/><path d="M3 17h12"/><circle cx="19" cy="17" r="1.5"/></svg><span class="nav-text">Orders</span></button>
        <button data-view="analysis" type="button"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M18.5 15.5l.9 2.6 2.6.9-2.6.9-.9 2.6-.9-2.6-2.6-.9 2.6-.9z"/></svg><span class="nav-text">Analysis</span></button>
        <button data-view="trading" type="button"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17.5 8.5 11l4 3.5L21 5"/><path d="M15 5h6v6"/></svg><span class="nav-text">Trading</span></button>
        <button data-view="newsMonitor" type="button"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h11a2 2 0 0 1 2 2v10H6a2 2 0 0 1-2-2z"/><path d="M17 9h3v7a2 2 0 0 1-2 2"/><path d="M8 11h5M8 14.5h3"/></svg><span class="nav-text">News monitor</span></button>
        <button data-view="playground" type="button"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4.5l13 7.5-13 7.5z"/></svg><span class="nav-text">Operations</span></button>
      </nav>
      <p class="sidebar-note">Workspace · Cabros Bot</p>
    </aside>
    <section class="console-content">
      <header class="topbar">
        <div>
          <p class="eyebrow">Operator workspace</p>
          <p class="topbar-title">Your operations, at a glance</p>
        </div>
        <div class="topbar-actions">
          <div id="sse-status" class="sse-indicator disconnected" title="Real-time stream: Offline" role="status" aria-live="polite">
            <span class="sse-dot" aria-hidden="true"></span>
            <span id="sse-label" class="sse-label">Offline</span>
          </div>
          <button id="toggle-sidebar" class="button-ghost" type="button" aria-pressed="false" aria-controls="console-nav">Collapse sidebar</button>
          <button id="clear-key" class="button-ghost" type="button">Clear key</button>
        </div>
      </header>
      <section id="firebase-auth" class="connection-card auth-card" aria-labelledby="firebase-auth-title" hidden>
        <div class="section-heading">
          <div>
            <p class="eyebrow">Authentication</p>
            <h2 id="firebase-auth-title">Admin sign-in</h2>
          </div>
          <span class="security-chip">Firebase Auth</span>
        </div>
        <form id="auth-form" class="auth-form" aria-labelledby="firebase-auth-title">
          <div class="field">
            <label for="auth-email">Email</label>
            <input id="auth-email" name="email" type="email" autocomplete="username" required aria-describedby="auth-credentials-error">
          </div>
          <div class="field">
            <label for="auth-password">Password</label>
            <input id="auth-password" name="password" type="password" autocomplete="current-password" required aria-describedby="auth-credentials-error">
          </div>
          <button id="sign-in" class="button-primary" type="submit">Sign in</button>
          <p id="auth-credentials-error" class="field-error" role="alert" hidden></p>
        </form>
        <button id="sign-out" class="button-ghost" type="button" hidden>Sign out</button>
        <p id="auth-state" class="request-state" aria-live="polite">Checking sign-in configuration…</p>
      </section>
      <section id="legacy-connection" class="connection-card" aria-labelledby="connection-title" hidden>
        <div class="section-heading">
          <div>
            <p class="eyebrow">Authentication</p>
            <h2 id="connection-title">Session access</h2>
          </div>
          <span class="security-chip">Session-only</span>
        </div>
        <form id="connection-form" class="connection-row">
          <div class="key-field">
            <label for="api-key">API key</label>
            <input id="api-key" name="apiKey" type="password" autocomplete="off" required aria-describedby="key-state">
          </div>
          <button id="save-key" class="button-primary" type="submit">Use key for this session</button>
        </form>
        <p id="key-state" class="request-state" aria-live="polite"></p>
      </section>
      <p id="view-status" class="request-state" role="status" aria-live="polite" aria-atomic="true"></p>
      <section id="view" tabindex="-1"></section>
    </section>
    <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>
  </main>
  <script src="/admin/vue.runtime.global.prod.js" defer></script>
  <script src="/admin/admin-components.js" defer></script>
  <script src="/admin/admin-request.js" defer></script>
  <script src="/admin/admin-charts.js" defer></script>
  <script src="/admin/admin-diagnostics.js" defer></script>
  <script src="/admin/admin-newsmonitor.js" defer></script>
  <script src="/admin/admin.js" defer></script>
</body>
</html>
