<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cabros Bot Console</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <main class="console-shell">
    <aside class="console-sidebar">
      <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true">CB</span>
        <div>
          <p class="eyebrow">Operations</p>
          <h1>Cabros Bot</h1>
        </div>
      </div>
      <nav class="console-nav" aria-label="Console sections">
        <p class="nav-label">Workspace</p>
        <button data-view="overview" type="button" aria-current="page"><span aria-hidden="true">⌂</span>Overview</button>
        <button data-view="status" type="button"><span aria-hidden="true">◈</span>Status</button>
        <button data-view="alerts" type="button"><span aria-hidden="true">◉</span>Alerts</button>
        <button data-view="presets" type="button"><span aria-hidden="true">◇</span>Presets</button>
        <button data-view="jobs" type="button"><span aria-hidden="true">◌</span>Jobs</button>
        <button data-view="analysis" type="button"><span aria-hidden="true">✦</span>Analysis</button>
        <button data-view="playground" type="button"><span aria-hidden="true">▷</span>Playground</button>
      </nav>
      <p class="sidebar-note">Protected operator console</p>
    </aside>
    <section class="console-content">
      <header class="topbar">
        <div>
          <p class="eyebrow">Operator workspace</p>
          <p class="topbar-title">Monitor, diagnose and trigger safely</p>
        </div>
        <button id="clear-key" class="button-ghost" type="button">Clear key</button>
      </header>
      <section class="connection-card" aria-labelledby="connection-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Authentication</p>
            <h2 id="connection-title">Session access</h2>
          </div>
          <span class="security-chip">Session-only</span>
        </div>
        <form id="connection-form" class="connection-row" novalidate>
          <label class="key-field">API key <input id="api-key" type="password" autocomplete="off"></label>
          <button id="save-key" class="button-primary" type="button">Use key for this session</button>
        </form>
        <p id="key-state" class="request-state" aria-live="polite"></p>
      </section>
      <section id="view" aria-live="polite"></section>
    </section>
  </main>
  <script src="/admin/admin-request.js" defer></script>
  <script src="/admin/admin.js" defer></script>
</body>
</html>
