<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cabros Bot Console</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <main class="console-shell">
    <aside class="console-sidebar">
      <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true">CB</span>
        <div>
          <p class="eyebrow">Operations</p>
          <h1>Cabros Bot</h1>
        </div>
      </div>
      <nav class="console-nav" aria-label="Console sections">
        <p class="nav-label">Workspace</p>
        <button data-view="overview" type="button" aria-current="page"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Overview</button>
        <button data-view="status" type="button"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l2.5-6 5 12L17 12h4"/></svg>Status</button>
        <button data-view="alerts" type="button"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3"/></svg>Alerts</button>
        <button data-view="outcomes" type="button"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>Outcomes</button>
        <button data-view="presets" type="button"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 9-7 9-7-9z"/></svg>Presets</button>
        <button data-view="jobs" type="button"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></svg>Jobs</button>
        <button data-view="analysis" type="button"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M18.5 15.5l.9 2.6 2.6.9-2.6.9-.9 2.6-.9-2.6-2.6-.9 2.6-.9z"/></svg>Analysis</button>
        <button data-view="playground" type="button"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4.5l13 7.5-13 7.5z"/></svg>Playground</button>
      </nav>
      <p class="sidebar-note">Protected operator console</p>
    </aside>
    <section class="console-content">
      <header class="topbar">
        <div>
          <p class="eyebrow">Operator workspace</p>
          <p class="topbar-title">Monitor, diagnose and trigger safely</p>
        </div>
        <button id="clear-key" class="button-ghost" type="button">Clear key</button>
      </header>
      <section id="firebase-auth" class="connection-card auth-card" aria-labelledby="firebase-auth-title" hidden>
        <div class="section-heading">
          <div>
            <p class="eyebrow">Authentication</p>
            <h2 id="firebase-auth-title">Admin sign-in</h2>
          </div>
          <span class="security-chip">Firebase Auth</span>
        </div>
        <div id="auth-form" class="auth-form">
          <label>Email <input id="auth-email" type="email" autocomplete="username"></label>
          <label>Password <input id="auth-password" type="password" autocomplete="current-password"></label>
          <button id="sign-in" class="button-primary" type="button">Sign in</button>
        </div>
        <button id="sign-out" class="button-ghost" type="button" hidden>Sign out</button>
        <p id="auth-state" class="request-state" aria-live="polite">Checking sign-in configuration…</p>
      </section>
      <section id="legacy-connection" class="connection-card" aria-labelledby="connection-title" hidden>
        <div class="section-heading">
          <div>
            <p class="eyebrow">Authentication</p>
            <h2 id="connection-title">Session access</h2>
          </div>
          <span class="security-chip">Session-only</span>
        </div>
        <form id="connection-form" class="connection-row" novalidate>
          <label class="key-field">API key <input id="api-key" type="password" autocomplete="off"></label>
          <button id="save-key" class="button-primary" type="button">Use key for this session</button>
        </form>
        <p id="key-state" class="request-state" aria-live="polite"></p>
      </section>
      <section id="view" aria-live="polite" tabindex="-1"></section>
    </section>
  </main>
  <script src="/admin/admin-request.js" defer></script>
  <script src="/admin/admin.js" defer></script>
</body>
</html>
