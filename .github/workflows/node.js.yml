# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
# Cancel superseded PR runs to free Actions minutes; preserve `master` pushes so
# a freshly merged commit never cancels its own follow-up run. See issue #565.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:

    runs-on: ubuntu-latest
    # Bounded CI run (was unbounded; default 360 min). 30 min covers install +
    # JDK 21 + emulator cache + full Jest suite + Firebase emulator suite.
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 10 # Compatible with the pinned Node.js 24 runtime
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    # Production dependency audit gate. See GitHub issue #760.
    # Critical-severity findings fail the build; high+moderate are reported
    # and tracked in `.pnpm-workspace.yaml` overrides. Mod-dev trees may still
    # contain dev-only advisories (build-chain chains) — see `pnpm audit` for
    # the dev report. JSON output is uploaded as an artifact for triage.
    - name: Production dependency audit (fail on critical)
      run: |
        set +e
        pnpm audit --prod --json --audit-level critical > audit-prod-critical.json 2>audit-prod-critical.stderr
        CRITICAL_RC=$?
        set -e
        if [ "$CRITICAL_RC" -ne 0 ]; then
          echo "::error::Critical production dependency advisories detected (pnpm audit exit $CRITICAL_RC)."
          echo "--- summary ---"
          cat audit-prod-critical.stderr || true
          echo "--- JSON ---"
          cat audit-prod-critical.json || true
          exit "$CRITICAL_RC"
        fi
        echo "No critical production dependency advisories."
    - name: Production dependency audit report (non-blocking)
      if: always()
      run: |
        set +e
        pnpm audit --prod --audit-level high > audit-prod-high.txt 2>&1
        HIGH_RC=$?
        set -e
        if [ "$HIGH_RC" -ne 0 ]; then
          echo "::warning::High-severity production dependency advisories detected. See audit-prod-high.txt artifact for the full report."
          cat audit-prod-high.txt
        else
          echo "No high-severity production dependency advisories."
        fi
    - name: Upload audit artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pnpm-audit-report
        path: |
          audit-prod-critical.json
          audit-prod-critical.stderr
          audit-prod-high.txt
        if-no-files-found: ignore
    - name: Setup Java for Firebase Firestore emulator
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - name: Cache Firebase emulator binaries
      uses: actions/cache@v4
      with:
        path: ~/.cache/firebase/emulators
        key: firebase-tools-15.25.1-${{ runner.os }}
    # ESLint gate. Currently the tree has ~800 pre-existing findings from the
    # deferred-cleanup convention, so the step is non-blocking with a fast-follow
    # plan to flip `continue-on-error` once the codebase is lint-clean (#565).
    - name: Lint
      run: pnpm run lint
      continue-on-error: true
    - name: Run Firestore emulator integration tests
      run: pnpm test:firebase
    # - run: pnpm run build --if-present # No build step needed for this project, yet.
    - run: pnpm test
