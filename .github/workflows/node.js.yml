# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 10 # Compatible with the pinned Node.js 24 runtime
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    - name: Setup Java for Firebase Firestore emulator
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - name: Cache Firebase emulator binaries
      uses: actions/cache@v4
      with:
        path: ~/.cache/firebase/emulators
        key: firebase-tools-15.25.1-${{ runner.os }}
    - name: Run Firestore emulator integration tests
      run: pnpm test:firebase
    # - run: pnpm run build --if-present # No build step needed for this project, yet.
    - run: pnpm test
