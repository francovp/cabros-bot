# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
# Cancel superseded PR runs to free Actions minutes; preserve `master` pushes so
# a freshly merged commit never cancels its own follow-up run. See issue #565.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:

    runs-on: ubuntu-latest
    # Bounded CI run (was unbounded; default 360 min). 30 min covers install +
    # JDK 21 + emulator cache + full Jest suite + Firebase emulator suite.
    timeout-minutes: 30

    steps:
    # SHA-pinned to full 40-char commit refs (supply-chain hardening, GH-803).
    # To bump: visit https://github.com/<owner>/<repo>/commits/<major-tag>, copy
    # the commit SHA, and update both the SHA and the version comment.
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Install pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: 10 # Compatible with the pinned Node.js 24 runtime
    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: .node-version
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    - name: Setup Java for Firebase Firestore emulator
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: temurin
        java-version: '21'
    - name: Cache Firebase emulator binaries
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/firebase/emulators
        key: firebase-tools-15.25.1-${{ runner.os }}
    # ESLint gate. Currently the tree has ~800 pre-existing findings from the
    # deferred-cleanup convention, so the step is non-blocking with a fast-follow
    # plan to flip `continue-on-error` once the codebase is lint-clean (#565).
    - name: Lint
      run: pnpm run lint
      continue-on-error: true
    - name: Run Firestore emulator integration tests
      run: pnpm test:firebase
    # - run: pnpm run build --if-present # No build step needed for this project, yet.
    - run: pnpm test
