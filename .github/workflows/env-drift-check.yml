name: Production Environment Drift Check

on:
  workflow_dispatch:
    inputs:
      variable_name:
        description: 'Optional single variable name to inspect across platforms (leave blank to audit full .env.example)'
        required: false
        default: ''
  schedule:
    # Weekly Monday 09:00 UTC drift audit. Catches drift between scheduled
    # runs even when the post-merge branch was fast-forwarded without
    # triggering this workflow.
    - cron: '0 9 * * 1'
  push:
    # Post-merge drift audit on master. Adds the same enforcement loop the
    # AGENTS.md "post-merge production environment synchronization" workflow
    # describes.
    branches: [master]
    paths:
      - '.env.example'
      - 'render.yaml'
      - 'scripts/sync-production-env.js'
      - '.github/workflows/env-drift-check.yml'

permissions:
  contents: read

jobs:
  env-drift-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

    - name: Install pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version-file: .node-version
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run Environment Sync & Drift Inspection
      run: |
        if [ -n "${{ github.event.inputs.variable_name }}" ]; then
          pnpm run sync:production-env --key "${{ github.event.inputs.variable_name }}"
        else
          pnpm run sync:production-env --check-drift --exit-on-drift
        fi

