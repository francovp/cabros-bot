name: Production Environment Drift Check

on:
  workflow_dispatch:
    inputs:
      variable_name:
        description: 'Optional single variable name to inspect across platforms (leave blank to audit full .env.example)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  env-drift-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

    - name: Install pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version-file: .node-version
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run Environment Sync & Drift Inspection
      run: |
        if [ -n "${{ github.event.inputs.variable_name }}" ]; then
          pnpm run sync:production-env --key "${{ github.event.inputs.variable_name }}"
        else
          pnpm run sync:production-env --check-drift
        fi
