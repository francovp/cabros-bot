name: Deploy Firebase Remote Config Server Template

# Publishes firebase-remote-config-template.json to the **server** Remote Config
# namespace (`projects/{projectId}/namespaces/firebase-server/serverRemoteConfig`),
# which is the namespace `admin.remoteConfig().initServerTemplate()` reads at
# runtime. Publishing to the default/client namespace is a silent no-op for the
# server loader. The first publish bootstraps the namespace (If-Match: *) because
# it does not exist until then.
#
# Enabling ENABLE_FIREBASE_REMOTE_CONFIG in the service without running this
# workflow leaves every value on the environment fallback. Verify activation via
# GET /api/status -> dependencies.firebaseRemoteConfig.templatePublished === true.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-remote-config-server-template:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'cabros-bot' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Configure Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy server-side Remote Config template
        run: pnpm run deploy:firebase-remote-config:server
