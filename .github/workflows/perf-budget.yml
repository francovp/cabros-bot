name: Performance Budget Guard

on:
  pull_request:
    branches: ["master"]
  push:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      soak:
        description: Run the optional 30-minute soak test
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 3 * * 1'

# Reuse the same minimal permissions the other workflows request (CB-257).
permissions:
  contents: read

# Cancel superseded PR runs; preserve pushes so a freshly merged commit never
# cancels its own follow-up run (issue #565).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  perf-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Soft-fail for at least one sprint while the team baselines the budget
    # numbers (see GH-795 rollout plan). Flip to a hard failure once the
    # baselines stabilize in `tests/performance/baselines/`.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Boot the app in API-only mode and hit each budgeted route via the
      # dedicated integration suite. The suite emits `console.warn` on
      # the soft envelope and fails on 2x unless PERF_BUDGET_RELAXED=true.
      - name: Run perf-budget integration tests
        env:
          ENABLE_API_ONLY_MODE: 'true'
          BOT_TOKEN: 'perf-budget-dummy-token'
          WEBHOOK_API_KEY: 'perf-budget-test-key'
        run: pnpm test -- tests/integration/perf-budget.test.js --testTimeout=60000

  performance:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: grafana/setup-k6-action@v0.3.1
      - run: pnpm install --frozen-lockfile
      - name: Run load and chaos checks
        if: github.event_name != 'workflow_dispatch' || inputs.soak != true
        run: pnpm test:perf
      - name: Run load, soak, and chaos checks
        if: github.event_name == 'workflow_dispatch' && inputs.soak == true
        run: pnpm test:perf -- --soak
