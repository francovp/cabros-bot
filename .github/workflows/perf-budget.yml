name: Performance Budget

on:
  workflow_dispatch:
    inputs:
      soak:
        description: Run the optional 30-minute soak test
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: grafana/setup-k6-action@v0.3.1
      - run: pnpm install --frozen-lockfile
      - name: Run load and chaos checks
        if: github.event_name != 'workflow_dispatch' || inputs.soak != true
        run: pnpm test:perf
      - name: Run load, soak, and chaos checks
        if: github.event_name == 'workflow_dispatch' && inputs.soak == true
        run: pnpm test:perf -- --soak
