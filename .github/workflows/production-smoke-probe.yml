name: Production Smoke Probe

# Scheduled GitHub Actions workflow that smoke-probes production after each
# deployment so a silently bad deployment fails the job instead of passing
# unnoticed.
#
# Alerting: this workflow has no paging step, and does not need one. A non-zero
# probe exit fails the scheduled run, and GitHub's own notification for a failed
# scheduled workflow is the alert channel. Telegram paging belongs to the
# secretless uptime monitor (external-uptime-monitor.yml), which pages once on a
# DOWN transition and once on recovery. Adding a second pager here would double
# the page for one outage and lose the recovery signal, which is the alert
# fatigue this repository has already been bitten by.
#
# The default target is the Render production web service
# (cabros-crypto-bot-telegram-iac). It must match the live platform: an earlier
# default pointed at the retired Railway host, which answers 404, so this job
# stayed red for every run while probing a host that no longer existed and a
# genuinely stale deploy was indistinguishable from a misconfigured target.
#
# The probe script lives in this repository, so `actions/checkout` is a hard
# prerequisite rather than a convenience. Without it every run died at exit 127
# before a single HTTP request, and the only automated production availability
# gate was a no-op that looked like a real failing gate (issue #971).
#
# Configuration:
#   1. (Normally unnecessary) Add GitHub repository variable
#      PRODUCTION_BASE_URL to override the default deployment URL.
#   2. Add GitHub secret WEBHOOK_API_KEY (matches the server's validateApiKey).
#      Required: without it the probe cannot run and the job reports
#      `probe_unconfigured` rather than a production failure.
#   3. (Optional) Override PRODUCTION_EXPECTED_COMMIT,
#      PRODUCTION_REQUIRE_READY_DEPS, PRODUCTION_REQUIRE_ENABLED_FLAGS and
#      PRODUCTION_PROBE_TIMEOUT via repository variables.
#
# PRODUCTION_REQUIRE_ENABLED_FLAGS is a comma-separated list of /api/status
# featureFlags that must be true on the deployed service. Use it to assert that
# an enablement declared in render.yaml actually landed in production rather
# than only being declared; a flag absent from the deployed build counts as
# disabled, so a stale deploy cannot satisfy the assertion.
#
# Failure classification: every run maps to exactly one outcome, so a broken CI
# setup is never mistaken for a production outage:
#   ok              healthy
#   down             production unreachable or unhealthy (exit 3 or 4)
#   stale            production serving a different commit (deploy in flight)
#   degraded         production reachable, a required dependency is not ready
#   flag_disabled    production reachable, a required feature flag is not true
#   unconfigured     WEBHOOK_API_KEY missing; the probe never ran
#   auth_rejected    /api/status answered 401/403: the secret was rotated or
#                    never matched. Production is up and serving; CI is wrong
#   script_missing   the probe script was absent or not executable
#   invalid_args     the probe rejected its arguments; a bug in this workflow
#   unknown          unclassified non-zero exit; reachability unknown
#
# The classification is the deliverable, not the paging. A stale deploy, a
# missing script, an unconfigured secret and a rotated secret are four different
# operational problems; collapsing them into one warning is how a broken CI setup
# reads as a production outage.
#
# Security: WEBHOOK_API_KEY is sent via the `x-api-key` header (never in URLs
# or query parameters) by piping it into curl through stdin. Job summaries and
# logs never echo the key.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Override PRODUCTION_BASE_URL'
        required: false
        default: ''
      expected_commit:
        description: 'Override PRODUCTION_EXPECTED_COMMIT'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  smoke-probe:
    name: Probe production deployment
    runs-on: ubuntu-latest
    timeout-minutes: 4

    env:
      PRODUCTION_BASE_URL: ${{ github.event.inputs.base_url || vars.PRODUCTION_BASE_URL || 'https://cabros-crypto-bot-telegram.onrender.com' }}
      PRODUCTION_REQUIRE_READY_DEPS: ${{ vars.PRODUCTION_REQUIRE_READY_DEPS || '' }}
      PRODUCTION_REQUIRE_ENABLED_FLAGS: ${{ vars.PRODUCTION_REQUIRE_ENABLED_FLAGS || '' }}
      PRODUCTION_PROBE_TIMEOUT: ${{ vars.PRODUCTION_PROBE_TIMEOUT || '15' }}

    steps:
      # The probe script lives in this repository, so the workspace must be
      # populated before anything invokes it.
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install jq (used by the probe script)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Determine the expected commit SHA
        id: master-sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_EXPECTED_COMMIT: ${{ github.event.inputs.expected_commit }}
        run: |
          set -euo pipefail
          if [[ -n "${DISPATCH_EXPECTED_COMMIT:-}" ]]; then
            echo "sha=$DISPATCH_EXPECTED_COMMIT" >> "$GITHUB_OUTPUT"
            echo "Using expected commit from workflow_dispatch input: $DISPATCH_EXPECTED_COMMIT"
            exit 0
          fi
          sha=""
          if [[ -n "${GH_TOKEN:-}" ]]; then
            sha="$(curl --silent --show-error --max-time 10 \
              -H 'accept: application/vnd.github+json' \
              -H "authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${{ github.repository }}/commits/master" \
              | jq -r '.sha // empty' || true)"
          fi
          if [[ -z "$sha" ]]; then
            sha="$(git ls-remote https://github.com/${{ github.repository }}.git master | awk '{print $1}' || true)"
          fi
          if [[ -z "$sha" ]]; then
            echo '::error::Unable to determine master SHA.'
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Latest master SHA: $sha"

      - name: Verify the probe script is available
        id: preflight
        run: |
          set -euo pipefail
          if [[ ! -f ops/production-smoke-probe.sh ]]; then
            echo "::error title=Probe script missing::probe_script_missing: ops/production-smoke-probe.sh was not found in the checked-out workspace. This is a bug in the CI workflow, NOT a production outage; the availability gate did not run."
            echo "outcome=script_missing" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          chmod +x ops/production-smoke-probe.sh
          if [[ ! -x ops/production-smoke-probe.sh ]]; then
            echo "::error title=Probe script not executable::probe_script_missing: ops/production-smoke-probe.sh is present but not executable after chmod. This is a bug in the CI workflow or the repository file mode, NOT a production outage; the availability gate did not run."
            echo "outcome=script_missing" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Run the smoke probe against the expected commit
        id: probe
        env:
          WEBHOOK_API_KEY: ${{ secrets.WEBHOOK_API_KEY }}
          PRODUCTION_EXPECTED_COMMIT: ${{ steps.master-sha.outputs.sha }}
        run: |
          set -euo pipefail
          set +e
          probe_output="$(ops/production-smoke-probe.sh 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$probe_output"
          detail="$(printf '%s\n' "$probe_output" | tail -n 1 | tr -d '\r')"
          case "$rc" in
            0)
              outcome=ok
              ;;
            2)
              outcome=unconfigured
              if [[ "$detail" == *AUTH_BLOCKED* ]]; then
                detail="AUTH_BLOCKED: the WEBHOOK_API_KEY repository secret is not set, so the probe never reached production"
              fi
              echo "::error title=Probe not configured::probe_unconfigured: $detail This is a CI misconfiguration, not a production outage."
              ;;
            3|4)
              outcome=down
              ;;
            5)
              outcome=stale
              ;;
            6)
              outcome=degraded
              ;;
            7)
              outcome=flag_disabled
              ;;
            8)
              outcome=auth_rejected
              echo "::error title=Probe authentication rejected::probe_auth_rejected: $detail Production answered the probe, so this is NOT a production outage: the WEBHOOK_API_KEY repository secret was rotated or never matched the server. Rotate the secret."
              ;;
            64)
              outcome=invalid_args
              ;;
            126|127)
              outcome=script_missing
              ;;
            *)
              outcome=unknown
              ;;
          esac
          {
            echo "probe_exit=$rc"
            echo "outcome=$outcome"
            echo "probe_detail=$detail"
          } >> "$GITHUB_OUTPUT"
          if [[ "$outcome" != "ok" ]]; then
            echo "::warning::Smoke probe exited with code $rc (outcome=$outcome)"
            exit 1
          fi
