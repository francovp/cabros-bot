name: Production Smoke Probe

# Scheduled GitHub Actions workflow that smoke-probes Railway production so a bad
# or missing deployment pages operators instead of silently killing alert delivery.
#
# Configuration:
#   1. Add GitHub repository variable PRODUCTION_BASE_URL with the canonical
#      deployment URL (default: https://cabros-bot-production.up.railway.app).
#   2. Add GitHub secret WEBHOOK_API_KEY (matches the server's validateApiKey).
#      Required: without it the probe cannot run and the job reports
#      `probe_unconfigured` rather than a production failure.
#   3. (Optional) Add GitHub secret TELEGRAM_BOT_TOKEN (admin-notifications
#      bot) and TELEGRAM_ADMIN_NOTIFICATIONS_CHAT_ID (target chat id) to
#      enable admin paging when production is unreachable. Without both, a real
#      outage is reported as `paging_not_configured` and the failed job is the
#      only signal.
#   4. (Optional) Override PRODUCTION_EXPECTED_COMMIT, PRODUCTION_REQUIRE_READY_DEPS,
#      PRODUCTION_PROBE_TIMEOUT, and PRODUCTION_PROBE_FAILURE_COOLDOWN_MINUTES
#      via repository variables.
#
# Failure classification: every run maps to exactly one outcome, so a broken CI
# setup is never mistaken for a production outage:
#   ok              healthy
#   down             production unreachable or unhealthy  -> pages the admin chat
#   stale            production serving a different commit (deploy in flight)
#   degraded         production reachable, a required dependency is not ready
#   unconfigured     WEBHOOK_API_KEY missing; the probe never ran
#   auth_rejected    /api/status answered 401/403: the secret was rotated or
#                    never matched. Production is up and serving; CI is wrong
#   script_missing   the probe script was absent or not executable
#   invalid_args     the probe rejected its arguments; a bug in this workflow
#   unknown          unclassified non-zero exit; reachability unknown
#
# Only `down` pages. Paging a stale deploy, a missing secret or a rotated secret
# would train operators to ignore the one signal that means alerts are not
# being delivered.
#
# Security: WEBHOOK_API_KEY is sent via the `x-api-key` header (never in URLs
# or query parameters) by piping it into curl through stdin. The Telegram bot
# token and chat id are never echoed; both helper scripts redact them from any
# provider output they surface. Job summaries and logs never echo these values.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Override PRODUCTION_BASE_URL'
        required: false
        default: ''
      expected_commit:
        description: 'Override PRODUCTION_EXPECTED_COMMIT'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  smoke-probe:
    name: Probe production deployment
    runs-on: ubuntu-latest
    timeout-minutes: 4

    env:
      PRODUCTION_BASE_URL: ${{ github.event.inputs.base_url || vars.PRODUCTION_BASE_URL || 'https://cabros-bot-production.up.railway.app' }}
      PRODUCTION_REQUIRE_READY_DEPS: ${{ vars.PRODUCTION_REQUIRE_READY_DEPS || '' }}
      PRODUCTION_PROBE_TIMEOUT: ${{ vars.PRODUCTION_PROBE_TIMEOUT || '15' }}
      PRODUCTION_PROBE_FAILURE_COOLDOWN_MINUTES: ${{ vars.PRODUCTION_PROBE_FAILURE_COOLDOWN_MINUTES || '60' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ADMIN_NOTIFICATIONS_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_NOTIFICATIONS_CHAT_ID }}

    steps:
      # The probe script lives in this repository, so the workspace must be
      # populated before anything invokes it.
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install jq (used by the probe script)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Restore the last operator page timestamp
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .smoke-probe-state
          key: production-smoke-probe-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            production-smoke-probe-

      - name: Determine the expected commit SHA
        id: master-sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_EXPECTED_COMMIT: ${{ github.event.inputs.expected_commit }}
        run: |
          set -euo pipefail
          if [[ -n "${DISPATCH_EXPECTED_COMMIT:-}" ]]; then
            echo "sha=$DISPATCH_EXPECTED_COMMIT" >> "$GITHUB_OUTPUT"
            echo "Using expected commit from workflow_dispatch input: $DISPATCH_EXPECTED_COMMIT"
            exit 0
          fi
          sha=""
          if [[ -n "${GH_TOKEN:-}" ]]; then
            sha="$(curl --silent --show-error --max-time 10 \
              -H 'accept: application/vnd.github+json' \
              -H "authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${{ github.repository }}/commits/master" \
              | jq -r '.sha // empty' || true)"
          fi
          if [[ -z "$sha" ]]; then
            sha="$(git ls-remote https://github.com/${{ github.repository }}.git master | awk '{print $1}' || true)"
          fi
          if [[ -z "$sha" ]]; then
            echo '::error::Unable to determine master SHA.'
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Latest master SHA: $sha"

      - name: Verify the probe script is available
        id: preflight
        run: |
          set -euo pipefail
          if [[ ! -f ops/production-smoke-probe.sh ]]; then
            echo "::error title=Probe script missing::probe_script_missing: ops/production-smoke-probe.sh was not found in the checked-out workspace. This is a bug in the CI workflow, NOT a production outage; the availability gate did not run."
            echo "outcome=script_missing" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          chmod +x ops/production-smoke-probe.sh ops/production-smoke-probe-notify.sh
          if [[ ! -x ops/production-smoke-probe.sh || ! -x ops/production-smoke-probe-notify.sh ]]; then
            echo "::error title=Probe script not executable::probe_script_missing: ops/production-smoke-probe.sh or ops/production-smoke-probe-notify.sh is present but not executable after chmod. This is a bug in the CI workflow or the repository file mode, NOT a production outage; the availability gate did not run."
            echo "outcome=script_missing" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Run the smoke probe against the expected commit
        id: probe
        env:
          WEBHOOK_API_KEY: ${{ secrets.WEBHOOK_API_KEY }}
          PRODUCTION_EXPECTED_COMMIT: ${{ steps.master-sha.outputs.sha }}
        run: |
          set -euo pipefail
          set +e
          probe_output="$(ops/production-smoke-probe.sh 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$probe_output"
          detail="$(printf '%s\n' "$probe_output" | tail -n 1 | tr -d '\r')"
          case "$rc" in
            0)
              outcome=ok
              ;;
            2)
              outcome=unconfigured
              if [[ "$detail" == *AUTH_BLOCKED* ]]; then
                detail="AUTH_BLOCKED: the WEBHOOK_API_KEY repository secret is not set, so the probe never reached production"
              fi
              echo "::error title=Probe not configured::probe_unconfigured: $detail This is a CI misconfiguration, not a production outage."
              ;;
            3|4)
              outcome=down
              ;;
            5)
              outcome=stale
              ;;
            6)
              outcome=degraded
              ;;
            7)
              outcome=auth_rejected
              echo "::error title=Probe authentication rejected::probe_auth_rejected: $detail Production answered the probe, so this is NOT a production outage: the WEBHOOK_API_KEY repository secret was rotated or never matched the server. Rotate the secret."
              ;;
            64)
              outcome=invalid_args
              ;;
            126|127)
              outcome=script_missing
              ;;
            *)
              outcome=unknown
              ;;
          esac
          {
            echo "probe_exit=$rc"
            echo "outcome=$outcome"
            echo "probe_detail=$detail"
          } >> "$GITHUB_OUTPUT"
          if [[ "$outcome" != "ok" ]]; then
            echo "::warning::Smoke probe exited with code $rc (outcome=$outcome)"
            exit 1
          fi

      - name: Page the admin chat when production is down
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.preflight.outputs.outcome || steps.probe.outputs.outcome }}
          PROBE_DETAIL: ${{ steps.probe.outputs.probe_detail }}
          PROBE_EXIT: ${{ steps.probe.outputs.probe_exit }}
          PROBE_BASE_URL: ${{ env.PRODUCTION_BASE_URL }}
          PROBE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PROBE_COOLDOWN_MINUTES: ${{ env.PRODUCTION_PROBE_FAILURE_COOLDOWN_MINUTES }}
          PROBE_COOLDOWN_STATE_FILE: .smoke-probe-state/last-page.env
        run: ops/production-smoke-probe-notify.sh

      - name: Persist the operator page timestamp
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .smoke-probe-state
          key: production-smoke-probe-${{ github.run_id }}-${{ github.run_attempt }}