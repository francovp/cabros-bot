name: Skills CI

on:
  push:
    branches: ["master"]
    paths:
      - '.agents/skills/**'
      - '.github/workflows/skills-ci.yml'
  pull_request:
    branches: ["master"]
    paths:
      - '.agents/skills/**'
      - '.github/workflows/skills-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-skills:
    name: Validate Agent Skills
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run skills validation suite
        run: bash .agents/skills/cabros-skill-optimizer/scripts/test-skills-e2e.sh --all
