previewsEnabled: true
services:
- type: web
  plan: free
  region: frankfurt
  name: cabros-crypto-bot-telegram-iac
  runtime: node
  repo: https://github.com/francovp/cabros-bot
  branch: master
  buildCommand: corepack enable && pnpm install --frozen-lockfile
  startCommand: corepack enable && pnpm start
  healthCheckPath: /healthcheck
  pullRequestPreviewsEnabled: true
  envVars:
  - key: TELEGRAM_ADMIN_NOTIFICATIONS_CHAT_ID
    sync: false
  - key: BOT_TOKEN
    sync: false
  - key: TELEGRAM_CHAT_ID
    sync: false
  - key: FIREBASE_PROJECT_ID
    sync: false
  - key: FIREBASE_SERVICE_ACCOUNT_JSON
    sync: false
  - key: ENABLE_TELEGRAM_BOT
    value: true
    previewValue: false
  - key: NEWS_GEMINI_CONCURRENCY
    value: 3
    previewValue: 3
  - key: JOB_EXECUTION_MODE
    value: local
    previewValue: local
  - key: ENABLE_FIRESTORE_JOB_STORAGE
    value: true
    previewValue: false
  - key: REDIS_URL
    fromService:
      name: cabros-crypto-bot-telegram-queue
      type: keyvalue
      property: connectionString
- type: worker
  plan: starter
  region: frankfurt
  name: cabros-crypto-bot-telegram-worker
  runtime: node
  repo: https://github.com/francovp/cabros-bot
  branch: master
  buildCommand: corepack enable && pnpm install --frozen-lockfile
  startCommand: corepack enable && pnpm run start-worker
  maxShutdownDelaySeconds: 120
  envVars:
  - key: JOB_EXECUTION_MODE
    value: render-worker
  - key: ENABLE_FIRESTORE_JOB_STORAGE
    value: true
  - key: REDIS_URL
    fromService:
      name: cabros-crypto-bot-telegram-queue
      type: keyvalue
      property: connectionString
  - key: BOT_TOKEN
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: BOT_TOKEN
  - key: TELEGRAM_CHAT_ID
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: TELEGRAM_CHAT_ID
  - key: TELEGRAM_ADMIN_NOTIFICATIONS_CHAT_ID
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: TELEGRAM_ADMIN_NOTIFICATIONS_CHAT_ID
  - key: ENABLE_TELEGRAM_BOT
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: ENABLE_TELEGRAM_BOT
  - key: ENABLE_WHATSAPP_ALERTS
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: ENABLE_WHATSAPP_ALERTS
  - key: WHATSAPP_API_URL
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: WHATSAPP_API_URL
  - key: WHATSAPP_API_KEY
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: WHATSAPP_API_KEY
  - key: WHATSAPP_CHAT_ID
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: WHATSAPP_CHAT_ID
  - key: WHATSAPP_PREVIEW_CHAT_ID
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: WHATSAPP_PREVIEW_CHAT_ID
  - key: ENABLE_DISCORD_ALERTS
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: ENABLE_DISCORD_ALERTS
  - key: DISCORD_WEBHOOK_URL
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: DISCORD_WEBHOOK_URL
  - key: FIREBASE_PROJECT_ID
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: FIREBASE_PROJECT_ID
  - key: FIREBASE_SERVICE_ACCOUNT_JSON
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: FIREBASE_SERVICE_ACCOUNT_JSON
  - key: JOB_CALLBACK_SIGNING_SECRET
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: JOB_CALLBACK_SIGNING_SECRET
  - key: ALLOW_HTTP_CALLBACKS
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: ALLOW_HTTP_CALLBACKS
  - key: ALLOW_PRIVATE_CALLBACKS
    fromService:
      name: cabros-crypto-bot-telegram-iac
