      envVarKey: JOB_QUEUE_CONNECT_TIMEOUT_MS
  - key: JOB_QUEUE_PROBE_TIMEOUT_MS
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: JOB_QUEUE_PROBE_TIMEOUT_MS
  - key: ENABLE_FIREBASE_REMOTE_CONFIG
    value: true
    previewValue: false
  # This worker starts `newsMonitorSchedulerService` and `alertSchedulerService`,
  # which resolve prompts through the same PromptService as the web service, so it
  # needs the same Langfuse gate or the two processes would use different prompt
  # versions for the same alert (#1178). The credentials are `sync: false`: an
  # operator must set them in the Render dashboard for this service.
  - key: ENABLE_LANGFUSE_PROMPTS
