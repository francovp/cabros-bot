      type: web
      envVarKey: NEWS_SYMBOLS_CRYPTO
  - key: NEWS_SYMBOLS_STOCKS
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: NEWS_SYMBOLS_STOCKS
  - key: ENABLE_FIRESTORE_JOB_STORAGE
    value: true
  - key: REDIS_URL
    fromService:
      name: cabros-crypto-bot-telegram-queue
      type: keyvalue
      property: connectionString
  - key: BOT_TOKEN
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: BOT_TOKEN
  - key: TELEGRAM_CHAT_ID
    fromService:
      name: cabros-crypto-bot-telegram-iac
