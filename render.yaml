previewsEnabled: true
# Native Render services read the repository-level .node-version file.
services:
- type: web
  plan: free
  region: frankfurt
  name: cabros-crypto-bot-telegram-iac
  runtime: node
  repo: https://github.com/francovp/cabros-bot
  branch: master
  buildCommand: corepack enable && pnpm install --frozen-lockfile
  startCommand: corepack enable && pnpm start
  healthCheckPath: /ready
  pullRequestPreviewsEnabled: true
  envVars:
  - key: TELEGRAM_ADMIN_NOTIFICATIONS_CHAT_ID
    sync: false
  - key: BOT_TOKEN
    sync: false
  - key: TELEGRAM_CHAT_ID
    sync: false
  - key: FIREBASE_PROJECT_ID
    value: cabros-bot
  - key: FIREBASE_SERVICE_ACCOUNT_JSON
    sync: false
  - key: ENABLE_FIREBASE_ADMIN_AUTH
    value: true
    previewValue: false
  - key: FIREBASE_WEB_API_KEY
    value: AIzaSyDskGc5b0hpVX6YIUW-IYqwuH7_ZIP07O0
    previewValue: ''
  - key: FIREBASE_AUTH_DOMAIN
    value: cabros-bot.firebaseapp.com
    previewValue: ''
  - key: FIREBASE_DATABASE_URL
    value: https://cabros-bot.firebaseio.com
    previewValue: ''
  - key: FIREBASE_APP_ID
    value: 1:391894492002:web:6d2f9a8519c0632cf3c23b
    previewValue: ''
  - key: FIREBASE_STORAGE_BUCKET
    value: cabros-bot.appspot.com
    previewValue: ''
  - key: FIREBASE_MESSAGING_SENDER_ID
    value: 391894492002
    previewValue: ''
  - key: FIREBASE_MEASUREMENT_ID
    value: G-392NYM9QFM
    previewValue: ''
  - key: ENABLE_TELEGRAM_BOT
    value: true
    previewValue: false
  # Durable webhook idempotency: web service only, previews off. See AGENTS.md.
  - key: ENABLE_FIRESTORE_IDEMPOTENCY
    value: true
    previewValue: false
  - key: NEWS_GEMINI_CONCURRENCY
    value: 3
    previewValue: 3
  # Signal outcome tracking (GH-1110). Pinned here, not dashboard-only, so the
  # gate that controls signal recording, the evaluation sweep and the whole
  # /api/outcomes surface is reviewable in the repo. Previews stay off: a PR
  # preview would record and evaluate against the production collection.
  # The web process records signals and sweeps them. The dedicated
  # cabros-crypto-bot-signal-outcome-worker below remains the cutover target;
  # the Firestore lease in SignalOutcomeService keeps exactly one of them acting
  # on a pending signal while both are configured.
  - key: ENABLE_SIGNAL_OUTCOME_TRACKING
    value: true
    previewValue: false
  - key: SIGNAL_OUTCOME_WORKER_ROLE
    value: web
  - key: SIGNAL_OUTCOME_EVALUATION_LEASE_MS
    value: 120000
  - key: JOB_EXECUTION_MODE
    value: local
    previewValue: local
  # BullMQ queue contract. Declared at the code defaults so an operator can see and
  # change them in the Render dashboard; until the paid Key Value is provisioned
  # these match the in-code defaults exactly, so declaring them changes nothing.
  - key: JOB_QUEUE_ATTEMPTS
    value: 5
  - key: JOB_QUEUE_BACKOFF_MS
    value: 30000
  - key: JOB_QUEUE_CONCURRENCY
    value: 1
  - key: JOB_QUEUE_CLAIM_LEASE_MS
    value: 60000
  - key: JOB_QUEUE_CONNECT_TIMEOUT_MS
    value: 5000
  - key: JOB_QUEUE_PROBE_TIMEOUT_MS
    value: 5000
  - key: ENABLE_FIRESTORE_JOB_STORAGE
    value: true
    previewValue: false
  # Durable scanner presets: web service only, previews off. See AGENTS.md.
  - key: ENABLE_FIRESTORE_SCANNER_PRESETS
    value: true
    previewValue: false
  # Server-side Remote Config. Enabled on every compute service that starts the
  # loader so they cannot evaluate different effective configs. Previews stay off.
  - key: ENABLE_FIREBASE_REMOTE_CONFIG
    value: true
    previewValue: false
  - key: REDIS_URL
    fromService:
      name: cabros-crypto-bot-telegram-queue
      type: keyvalue
      property: connectionString
- type: worker
  plan: starter
  region: frankfurt
  name: cabros-crypto-bot-telegram-worker
  runtime: node
  repo: https://github.com/francovp/cabros-bot
  branch: master
  buildCommand: corepack enable && pnpm install --frozen-lockfile
  startCommand: corepack enable && pnpm run start-worker
  maxShutdownDelaySeconds: 120
  envVars:
  - key: JOB_EXECUTION_MODE
    value: render-worker
  # Mirrored from web so both sides resolve the same queue contract; the values
  # below are the in-code defaults.
  - key: JOB_QUEUE_ATTEMPTS
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: JOB_QUEUE_ATTEMPTS
  - key: JOB_QUEUE_BACKOFF_MS
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: JOB_QUEUE_BACKOFF_MS
  - key: JOB_QUEUE_CONCURRENCY
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: JOB_QUEUE_CONCURRENCY
  - key: JOB_QUEUE_CLAIM_LEASE_MS
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: JOB_QUEUE_CLAIM_LEASE_MS
  - key: JOB_QUEUE_CONNECT_TIMEOUT_MS
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: JOB_QUEUE_CONNECT_TIMEOUT_MS
  - key: JOB_QUEUE_PROBE_TIMEOUT_MS
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: JOB_QUEUE_PROBE_TIMEOUT_MS
  - key: ENABLE_FIREBASE_REMOTE_CONFIG
    value: true
    previewValue: false
  - key: ENABLE_NOTIFICATION_REDRIVE
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: ENABLE_NOTIFICATION_REDRIVE
  - key: NOTIFICATION_REDRIVE_WORKER_ROLE
    value: worker
  - key: NOTIFICATION_REDRIVE_INTERVAL_MS
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: NOTIFICATION_REDRIVE_INTERVAL_MS
  - key: NOTIFICATION_REDRIVE_BATCH_LIMIT
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: NOTIFICATION_REDRIVE_BATCH_LIMIT
  - key: NOTIFICATION_REDRIVE_MAX_ATTEMPTS
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: NOTIFICATION_REDRIVE_MAX_ATTEMPTS
  - key: NOTIFICATION_REDRIVE_MAX_AGE_MS
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: NOTIFICATION_REDRIVE_MAX_AGE_MS
  - key: ENABLE_NEWS_MONITOR
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: ENABLE_NEWS_MONITOR
  - key: ENABLE_NEWS_MONITOR_SCHEDULER
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: ENABLE_NEWS_MONITOR_SCHEDULER
  # Inherited, not hardcoded: the web service owns the sweep role. Hardcoding
  # `worker` here made `web`/`disabled` on the web service a no-op for this
  # worker, because startWorker({source:'worker'}) matched the local value
  # against its own source instead of the configured role. See issue #1136.
  - key: NEWS_MONITOR_SCHEDULER_WORKER_ROLE
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: NEWS_MONITOR_SCHEDULER_WORKER_ROLE
  - key: NEWS_MONITOR_SCHEDULER_INTERVAL_MS
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: NEWS_MONITOR_SCHEDULER_INTERVAL_MS
  - key: NEWS_MONITOR_SCHEDULER_BATCH_LIMIT
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: NEWS_MONITOR_SCHEDULER_BATCH_LIMIT
  - key: NEWS_MONITOR_SCHEDULER_LEASE_MS
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: NEWS_MONITOR_SCHEDULER_LEASE_MS
  - key: ENABLE_USER_PRICE_ALERTS
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: ENABLE_USER_PRICE_ALERTS
  - key: USER_PRICE_ALERT_WORKER_ROLE
    value: worker
  - key: USER_PRICE_ALERT_EVALUATION_INTERVAL_MS
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: USER_PRICE_ALERT_EVALUATION_INTERVAL_MS
  - key: USER_PRICE_ALERT_EVALUATION_BATCH_LIMIT
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: USER_PRICE_ALERT_EVALUATION_BATCH_LIMIT
  - key: USER_PRICE_ALERT_MAX_PER_CHAT
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: USER_PRICE_ALERT_MAX_PER_CHAT
  - key: USER_PRICE_ALERT_RETENTION_DAYS
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: USER_PRICE_ALERT_RETENTION_DAYS
  - key: USER_PRICE_ALERT_LEASE_MS
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: USER_PRICE_ALERT_LEASE_MS
  - key: USER_PRICE_ALERT_PRICE_FETCH_CONCURRENCY
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: USER_PRICE_ALERT_PRICE_FETCH_CONCURRENCY
  - key: NEWS_MONITOR_SCHEDULER_TIMEOUT_MS
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: NEWS_MONITOR_SCHEDULER_TIMEOUT_MS
  # LLM provider contract for the sweeps above. analyzeNewsForSymbol() calls
  # genaiClient.search() and then llmCallv2(); with none of these set the worker
  # throws "All LLM providers failed. Last error: No providers configured" for
  # every symbol. GEMINI_MODEL_NAME is load-bearing even though it looks
  # redundant: llmCallv2() gates the Gemini branch on
  # MODEL_PROVIDER === 'gemini' && GEMINI_MODEL_NAME, so inheriting only
  # GEMINI_API_KEY still leaves no configured provider. The alternative-provider
  # keys are inherited too, so switching MODEL_PROVIDER on the web service does
  # not produce a worker with no credentials. See issue #1136.
  - key: MODEL_PROVIDER
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: MODEL_PROVIDER
  - key: GEMINI_API_KEY
