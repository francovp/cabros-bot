previewsEnabled: true
services:
- type: web
  plan: free
  region: frankfurt
  name: cabros-crypto-bot-telegram-iac
  runtime: node
  repo: https://github.com/francovp/cabros-bot
  branch: master
  buildCommand: corepack enable && pnpm install --frozen-lockfile
  startCommand: corepack enable && pnpm start
  healthCheckPath: /healthcheck
  pullRequestPreviewsEnabled: true
  envVars:
  - key: TELEGRAM_ADMIN_NOTIFICATIONS_CHAT_ID
    sync: false
  - key: BOT_TOKEN
    sync: false
  - key: TELEGRAM_CHAT_ID
    sync: false
  - key: ENABLE_TELEGRAM_BOT
    value: true
    previewValue: false
  - key: NEWS_GEMINI_CONCURRENCY
    value: 3
    previewValue: 3
  - key: SIGNAL_OUTCOME_WORKER_ROLE
    value: web
- type: worker
  plan: starter
  region: frankfurt
  name: cabros-crypto-bot-signal-outcome-worker
  runtime: node
  numInstances: 1
  repo: https://github.com/francovp/cabros-bot
  branch: master
  buildCommand: corepack enable && pnpm install --frozen-lockfile
  startCommand: corepack enable && pnpm run start:signal-outcome-worker
  maxShutdownDelaySeconds: 60
  envVars:
  - key: ENABLE_SIGNAL_OUTCOME_TRACKING
    sync: false
  - key: ENABLE_SENTRY
    sync: false
  - key: SENTRY_DSN
    sync: false
  - key: SIGNAL_OUTCOME_WORKER_ROLE
    value: worker
  - key: SIGNAL_OUTCOME_EVALUATION_INTERVAL_MS
    value: 300000
  - key: SIGNAL_OUTCOME_EVALUATION_BATCH_LIMIT
    value: 50
  - key: SIGNAL_OUTCOME_EVALUATION_MAX_DURATION_MS
    value: 30000
  - key: FIREBASE_PROJECT_ID
    sync: false
  - key: FIREBASE_SERVICE_ACCOUNT_JSON
    sync: false
  - key: ENABLE_EQUITY_MARKET_DATA
    sync: false
  - key: EQUITY_MARKET_DATA_PROVIDER
    value: twelve-data
  - key: TWELVE_DATA_API_KEY
    sync: false
  - key: TWELVE_DATA_BASE_URL
    value: https://api.twelvedata.com
  - key: EQUITY_MARKET_DATA_TIMEOUT_MS
    value: 5000
  previews:
    generation: off
version: "1"
