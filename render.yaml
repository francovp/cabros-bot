previewsEnabled: true
# Native Render services read the repository-level .node-version file.
services:
- type: web
  plan: free
  region: frankfurt
  name: cabros-crypto-bot-telegram-iac
  runtime: node
  repo: https://github.com/francovp/cabros-bot
  branch: master
  buildCommand: corepack enable && pnpm install --frozen-lockfile
  startCommand: corepack enable && pnpm start
  healthCheckPath: /ready
  pullRequestPreviewsEnabled: true
  envVars:
  - key: TELEGRAM_ADMIN_NOTIFICATIONS_CHAT_ID
    sync: false
  - key: BOT_TOKEN
    sync: false
  - key: TELEGRAM_CHAT_ID
    sync: false
  - key: FIREBASE_PROJECT_ID
    value: cabros-bot
  - key: FIREBASE_SERVICE_ACCOUNT_JSON
    sync: false
  - key: ENABLE_FIREBASE_ADMIN_AUTH
    value: true
    previewValue: false
  - key: FIREBASE_WEB_API_KEY
    value: AIzaSyDskGc5b0hpVX6YIUW-IYqwuH7_ZIP07O0
    previewValue: ''
  - key: FIREBASE_AUTH_DOMAIN
    value: cabros-bot.firebaseapp.com
    previewValue: ''
  - key: FIREBASE_DATABASE_URL
    value: https://cabros-bot.firebaseio.com
    previewValue: ''
  - key: FIREBASE_APP_ID
    value: 1:391894492002:web:6d2f9a8519c0632cf3c23b
    previewValue: ''
  - key: FIREBASE_STORAGE_BUCKET
    value: cabros-bot.appspot.com
    previewValue: ''
  - key: FIREBASE_MESSAGING_SENDER_ID
    value: 391894492002
    previewValue: ''
  - key: FIREBASE_MEASUREMENT_ID
    value: G-392NYM9QFM
    previewValue: ''
  - key: ENABLE_TELEGRAM_BOT
    value: true
    previewValue: false
  # Durable webhook idempotency: web service only, previews off. See AGENTS.md.
  - key: ENABLE_FIRESTORE_IDEMPOTENCY
    value: true
    previewValue: false
  - key: NEWS_GEMINI_CONCURRENCY
    value: 3
    previewValue: 3
  # Signal outcome tracking (GH-1110). Pinned here, not dashboard-only, so the
  # gate that controls signal recording, the evaluation sweep and the whole
  # /api/outcomes surface is reviewable in the repo. Previews stay off: a PR
  # preview would record and evaluate against the production collection.
  # The web process records signals and sweeps them. The dedicated
  # cabros-crypto-bot-signal-outcome-worker below remains the cutover target;
  # the Firestore lease in SignalOutcomeService keeps exactly one of them acting
  # on a pending signal while both are configured.
  - key: ENABLE_SIGNAL_OUTCOME_TRACKING
    value: true
    previewValue: false
  - key: SIGNAL_OUTCOME_WORKER_ROLE
    value: web
  - key: SIGNAL_OUTCOME_EVALUATION_LEASE_MS
    value: 120000
  - key: JOB_EXECUTION_MODE
    value: local
    previewValue: local
  # BullMQ queue contract. Declared at the code defaults so an operator can see and
  # change them in the Render dashboard; until the paid Key Value is provisioned
  # these match the in-code defaults exactly, so declaring them changes nothing.
  - key: JOB_QUEUE_ATTEMPTS
    value: 5
  - key: JOB_QUEUE_BACKOFF_MS
    value: 30000
  - key: JOB_QUEUE_CONCURRENCY
    value: 1
  - key: JOB_QUEUE_CLAIM_LEASE_MS
    value: 60000
  - key: JOB_QUEUE_CONNECT_TIMEOUT_MS
    value: 5000
  - key: JOB_QUEUE_PROBE_TIMEOUT_MS
    value: 5000
  - key: ENABLE_FIRESTORE_JOB_STORAGE
    value: true
    previewValue: false
  # Durable scanner presets: web service only, previews off. See AGENTS.md.
  - key: ENABLE_FIRESTORE_SCANNER_PRESETS
    value: true
    previewValue: false
# Durable news-monitor analysis records (#1180): web service only, previews off.
  # Only the web service mounts /api/news-monitor, so a worker declaration would be
  # a mirror of a value the web service never set. Previews stay off so a throwaway
  # PR deploy cannot write into the production news_analysis collection.
  # Environment-only: this gate decides where a collection lives, so it is
  # deliberately absent from firebase-remote-config-template.json. A template
  # parameter's defaultValue is reported with source `remote` and would otherwise
  # override this env var and silently disable persistence.
  - key: ENABLE_FIRESTORE_NEWS_ANALYSIS
    value: true
    previewValue: false
  - key: NEWS_ANALYSIS_RETENTION_DAYS
    value: 30
  # Durable symbol-analysis history for /api/symbol-analyses: web service only,
  # previews off. The writer is the HTTP route layer in
  # src/controllers/webhooks/handlers/symbolAnalysis/symbolAnalysis.js, and
  # worker.js never mounts routes, so the worker stays off rather than becoming a
  # second writer. Declared at the code default so an operator can see and change
  # the TTL horizon without leaving the blueprint.
  - key: ENABLE_SYMBOL_ANALYSIS_STORAGE
    value: true
    previewValue: false
  - key: SYMBOL_ANALYSIS_RETENTION_DAYS
    value: 7
  # Server-side Remote Config. Enabled on every compute service that starts the
  # loader so they cannot evaluate different effective configs. Previews stay off.
  - key: ENABLE_FIREBASE_REMOTE_CONFIG
    value: true
    previewValue: false
  # Langfuse dynamic prompts (#1178). Declared on every compute service that can
  # resolve a prompt, because PromptService falls back to the local file on any
  # remote failure: a split gate makes two processes silently use different prompt
  # versions for the same alert. Previews stay off so a throwaway PR deploy cannot
  # publish traces against the production Langfuse project or consume its quota.
  # `dependencies.langfuse.ready` is proven from observed resolutions, not this flag.
  - key: ENABLE_LANGFUSE_PROMPTS
    value: true
    previewValue: false
  - key: LANGFUSE_PROMPT_LABEL
    value: production
  - key: LANGFUSE_PROMPT_CACHE_TTL_SECONDS
    value: 300
  - key: LANGFUSE_PUBLIC_KEY
    sync: false
  - key: LANGFUSE_SECRET_KEY
    sync: false
  # TradingView confluence enrichment: web service only, previews off. See AGENTS.md.
  - key: ENABLE_TRADINGVIEW_CONFLUENCE_ENRICHMENT
    value: true
    previewValue: false
  # MTF is nested inside the confluence gate, so it needs a web-service value of its
  # own: without this the worker's fromService mirror below pointed at a key the web
  # service never set - the same dangling-mirror shape as the flag above.
  - key: ENABLE_TRADINGVIEW_CONFLUENCE_MULTI_TIMEFRAME
    value: true
    previewValue: false
  - key: REDIS_URL
    fromService:
      name: cabros-crypto-bot-telegram-queue
      type: keyvalue
      property: connectionString
- type: worker
  plan: starter
  region: frankfurt
  name: cabros-crypto-bot-telegram-worker
  runtime: node
  repo: https://github.com/francovp/cabros-bot
  branch: master
  buildCommand: corepack enable && pnpm install --frozen-lockfile
  startCommand: corepack enable && pnpm run start-worker
  maxShutdownDelaySeconds: 120
  envVars:
  - key: JOB_EXECUTION_MODE
    value: render-worker
  # Mirrored from web so both sides resolve the same queue contract; the values
  # below are the in-code defaults.
  - key: JOB_QUEUE_ATTEMPTS
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: JOB_QUEUE_ATTEMPTS
  - key: JOB_QUEUE_BACKOFF_MS
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: JOB_QUEUE_BACKOFF_MS
  - key: JOB_QUEUE_CONCURRENCY
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: JOB_QUEUE_CONCURRENCY
  - key: JOB_QUEUE_CLAIM_LEASE_MS
    fromService:
      name: cabros-crypto-bot-telegram-iac
      type: web
      envVarKey: JOB_QUEUE_CLAIM_LEASE_MS
  - key: JOB_QUEUE_CONNECT_TIMEOUT_MS
    fromService:
      name: cabros-crypto-bot-telegram-iac
