allowBuilds:
  '@firebase/util': true
  protobufjs: true
  unrs-resolver: true
# Security remediation: pin transitive packages to patched versions to clear
# `pnpm audit --prod --audit-level high` (1 critical protobufjs ACE + 39 high).
# See GitHub issue #760. Update alongside `package.json` when upgrading
# direct dependencies that resolve to the listed transitive chains.
overrides:
  'protobufjs@>=7.0.0 <7.5.5': '>=7.5.5'
  'path-to-regexp@>=0.1.0 <0.1.13': '>=0.1.13 <0.2.0'
  'node-forge@>=1.0.0 <1.4.0': '>=1.4.0'
  'fast-uri@>=3.0.0 <3.1.3': '>=3.1.3'
  'ws@>=7.0.0 <8.21.0': '>=8.21.0'
  'axios@>=1.0.0 <1.15.1': '>=1.15.1'
  'nanoid@>=3.0.0 <3.3.18': '>=3.3.18'
  'minimatch@>=3.0.0 <9.0.7': '>=9.0.7'
  'body-parser@<1.20.6': '>=1.20.6'
  'qs@>=6.7.0 <6.15.2': '>=6.15.2'
  '@tootallnate/once@<2.0.1': '>=2.0.1'
  'serialize-javascript@<7.0.3': '>=7.0.3'
  'picomatch@<2.3.2': '>=2.3.2'
